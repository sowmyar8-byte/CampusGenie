<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusGenie · DSU Student Assistant</title>
<style>
:root{--bg:#fff;--side:#f7f7fb;--ink:#1f2330;--mute:#737891;--line:#e3e5ef;--card:#fff;--hover:#eceefa;--p:#5b5bf0;--p2:#8b5cf6;--user:#eef0ff;--shadow:0 2px 10px rgba(30,30,80,.06)}
:root[data-theme=dark]{--bg:#12141c;--side:#0d0f15;--ink:#e9ebf7;--mute:#8d93ad;--line:#272b3a;--card:#181b26;--hover:#1e2230;--user:#232850;--shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12141c;--side:#0d0f15;--ink:#e9ebf7;--mute:#8d93ad;--line:#272b3a;--card:#181b26;--hover:#1e2230;--user:#232850;--shadow:none}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:Inter,system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:flex}
button{font:inherit;color:inherit;cursor:pointer}
/* sidebar */
aside{width:280px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:12px;flex:none;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;padding:4px 6px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;color:#fff;font-size:18px}
.new{display:flex;align-items:center;gap:8px;width:100%;padding:11px 14px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-weight:600;box-shadow:var(--shadow)}
.new:hover{border-color:var(--p)}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);outline:0;font-size:13px}
#hist{flex:1;overflow-y:auto;margin:0 -6px;padding:0 6px}
.grp{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:14px 8px 6px}
.item{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;font-size:14px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--hover)}.item.on{background:var(--hover);border-color:var(--line)}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .del{opacity:0;border:0;background:none;color:var(--mute);padding:2px 6px;border-radius:6px}.item:hover .del{opacity:1}.del:hover{color:#e5484d}
.sfoot{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--mute)}
.sfoot button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;text-align:left}
/* main */
main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line)}
.top h2{margin:0;font-size:15px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--mute)}
.burger{display:none;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px}
#scroll{flex:1;overflow-y:auto}
.col{max-width:780px;margin:0 auto;padding:24px 20px}
.msg{display:flex;gap:14px;margin-bottom:26px}
.av{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:16px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.msg.user{justify-content:flex-end}.msg.user .av{display:none}
.msg.user .body{background:var(--user);border:1px solid var(--line);border-radius:16px;padding:10px 16px;max-width:80%}
.body{min-width:0;line-height:1.65;font-size:15px}.msg.bot .body{flex:1}
.body p{margin:0 0 10px}.body p:last-child{margin:0}.body ul{margin:4px 0 10px;padding-left:22px}.body li{margin:4px 0}
.acts{display:flex;gap:6px;margin-top:10px}
.acts button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 9px;font-size:12px;color:var(--mute)}
.acts button:hover{background:var(--hover);color:var(--ink)}.acts .on{border-color:var(--p);color:var(--p)}
.srcs{margin-top:12px;display:grid;gap:8px}
.src{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.src b{font-size:13px;display:block}.src a{font-size:12px;color:var(--p);text-decoration:none}.src small{display:block;margin-top:4px;color:var(--mute);font-size:12px;line-height:1.45}
.lab{font-size:12px;color:var(--mute);margin-top:12px;font-weight:600}
.meta{font-size:11px;color:var(--mute);margin-top:8px}
.dots{display:inline-flex;gap:4px;padding:8px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
/* welcome */
.hero{text-align:center;padding:48px 0 24px}.hero .logo{width:60px;height:60px;font-size:32px;border-radius:18px;margin:0 auto 16px}
.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;color:var(--mute)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
.card{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);transition:.15s}
.card:hover{border-color:var(--p);transform:translateY(-2px)}.card b{display:block;font-size:13px;color:var(--p);margin-bottom:4px}.card span{font-size:14px}
/* composer */
.comp{padding:0 20px 14px}.box{max-width:780px;margin:0 auto;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:8px 8px 8px 16px;display:flex;align-items:flex-end;gap:8px;box-shadow:var(--shadow)}
.box:focus-within{border-color:var(--p)}
textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:inherit;font-size:15px;max-height:140px;padding:9px 0}
#mic{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:transparent;font-size:16px}#mic.on{background:#e5484d;color:#fff;border-color:#e5484d}
#go{width:38px;height:38px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-size:18px}
#go:disabled{opacity:.4;cursor:not-allowed}
.note{max-width:780px;margin:8px auto 0;text-align:center;font-size:11.5px;color:var(--mute)}
@media(max-width:760px){aside{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%)}aside.open{transform:none}.burger{display:block}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><div class="logo">🎓</div>CampusGenie</div>
  <button class="new" id="new">＋ New chat</button>
  <input class="search" id="search" placeholder="Search chats...">
  <div id="hist"></div>
  <div class="sfoot"><button id="theme">🌓 Switch theme</button><button id="clear">🗑 Clear all history</button><div>Answers come from DSU documents. History is saved only in this browser.</div></div>
</aside>
<main>
  <div class="top"><button class="burger" id="burger">☰</button><h2 id="title">New chat</h2><span class="badge">Hybrid RAG · DSU MCA documents</span></div>
  <div id="scroll"><div class="col" id="col"></div></div>
  <div class="comp">
    <div class="box"><textarea id="q" rows="1" maxlength="500" placeholder="Ask about attendance, exams, grading, courses, library..."></textarea><button id="mic" title="Voice input" type="button">🎤</button><button id="go" title="Send">➤</button></div>
    <div class="note">CampusGenie can make mistakes. Verify important decisions with your department or the latest official circular.</div>
  </div>
</main>
<script>
const $=id=>document.getElementById(id),KEY='cg_chats_v2';
const CARDS=[["Attendance","What attendance do I need for the end semester exam?"],["Condonation","What reasons are accepted for attendance condonation?"],["Grading","How do I convert CGPA to percentage?"],["Courses","Which subjects are in the third semester of MCA?"]];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let chats=[],cur=null,busy=false;
try{chats=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(chats))}catch(e){}};
const th=(()=>{try{return localStorage.getItem('cg_theme')}catch(e){}})();if(th)document.documentElement.dataset.theme=th;
function md(t){let o='',l=false;for(const x of esc(t).split('\n')){const m=x.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
 if(m){if(!l){o+='<ul>';l=true}o+='<li>'+m[1]+'</li>'}else{if(l){o+='</ul>';l=false}if(x.trim())o+='<p>'+x+'</p>'}}
 if(l)o+='</ul>';return o.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function renderSide(){const f=$('search').value.toLowerCase(),h=$('hist');h.innerHTML='';
 const day=864e5,now=new Date().setHours(0,0,0,0),G={Today:[],Yesterday:[],Earlier:[]};
 chats.filter(c=>c.title.toLowerCase().includes(f)).forEach(c=>(c.created>=now?G.Today:c.created>=now-day?G.Yesterday:G.Earlier).push(c));
 for(const[g,a]of Object.entries(G)){if(!a.length)continue;h.insertAdjacentHTML('beforeend',`<div class="grp">${g}</div>`);
  a.forEach(c=>{const d=document.createElement('div');d.className='item'+(c.id===cur?' on':'');d.innerHTML=`<span>${esc(c.title)}</span><button class="del" title="Delete">✕</button>`;
   d.onclick=()=>{cur=c.id;render();$('side').classList.remove('open')};
   d.querySelector('.del').onclick=e=>{e.stopPropagation();chats=chats.filter(x=>x.id!==c.id);if(cur===c.id)cur=null;save();render()};h.appendChild(d)})}}
function msgEl(m,ci,mi){const e=document.createElement('div');e.className='msg '+m.role;
 if(m.role==='user'){e.innerHTML=`<div class="body">${esc(m.content)}</div>`;return e}
 let s='';if(m.sources&&m.sources.length)s=`<div class="lab">📄 Sources</div><div class="srcs">`+m.sources.map(x=>`<div class="src"><b>${esc(x.title)}</b>`+
  (x.url&&x.url.startsWith('http')?`<a href="${esc(x.url.split(' and ')[0])}" target="_blank" rel="noopener">Open official source ↗</a>`:'')+`<small>${esc(x.snippet)}</small></div>`).join('')+`</div>`;
 e.innerHTML=`<div class="av">🎓</div><div class="body">${md(m.content)}${s}<div class="acts"><button data-a="copy">Copy</button><button data-a="up" class="${m.fb==='up'?'on':''}">👍</button><button data-a="down" class="${m.fb==='down'?'on':''}">👎</button></div><div class="meta">${m.rewritten?'🔎 Understood as: '+esc(m.rewritten)+' · ':''}${m.meta||''}</div></div>`;
 e.querySelector('.acts').onclick=ev=>{const a=ev.target.dataset.a;if(!a)return;
  if(a==='copy'){navigator.clipboard&&navigator.clipboard.writeText(m.content);ev.target.textContent='Copied ✓'}
  else{m.fb=m.fb===a?null:a;save();fetch('/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:m.q||'',answer:m.content,vote:m.fb||'none'})}).catch(()=>{});render(true)}};return e}
function render(keep){const c=chats.find(x=>x.id===cur),col=$('col'),sc=$('scroll').scrollTop;col.innerHTML='';$('title').textContent=c?c.title:'New chat';
 if(!c){col.innerHTML=`<div class="hero"><div class="logo">🎓</div><h1>How can I help you today?</h1><p>Ask me about DSU MCA rules, exams, grading, courses and the library.</p></div><div class="cards"></div>`;
  CARDS.forEach(([t,q])=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<b>${t}</b><span>${esc(q)}</span>`;b.onclick=()=>send(q);col.querySelector('.cards').appendChild(b)})}
 else c.messages.forEach((m,i)=>col.appendChild(msgEl(m)));
 renderSide();$('scroll').scrollTop=keep?sc:1e9}
async function send(text){text=text.trim();if(!text||busy)return;busy=true;$('go').disabled=true;
 let c=chats.find(x=>x.id===cur);if(!c){c={id:Date.now(),title:text.length>42?text.slice(0,42)+'…':text,created:Date.now(),messages:[]};chats.unshift(c);cur=c.id}
 const hist=c.messages.slice(-6).filter(m=>!String(m.content).startsWith('⚠️')).map(m=>({role:m.role==='bot'?'assistant':'user',content:m.content}));
 c.messages.push({role:'user',content:text});save();$('q').value='';autosize();render();
 const w=document.createElement('div');w.className='msg bot';w.innerHTML='<div class="av">🎓</div><div class="body"><span class="dots"><i></i><i></i><i></i></span></div>';
 $('col').appendChild(w);const body=w.querySelector('.body');$('scroll').scrollTop=1e9;
 const m={role:'bot',content:'',q:text};let txt='';
 try{const r=await fetch('/ask_stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text,history:hist})});
  if(!r.ok||!r.body)throw new Error('bad response');
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  while(true){const{value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const parts=buf.split('\n\n');buf=parts.pop();
   for(const p of parts){if(!p.startsWith('data: '))continue;const ev=JSON.parse(p.slice(6));
    if(ev.event==='token'){txt+=ev.data;body.innerHTML=md(txt);$('scroll').scrollTop=1e9}
    else if(ev.event==='done'){Object.assign(m,{content:ev.data.answer,sources:ev.data.sources,rewritten:ev.data.rewritten,meta:ev.data.latency_s+'s'+(ev.data.abstained?' · no matching document found':'')})}
    else if(ev.event==='error'){m.content='⚠️ '+ev.data}}}
  if(!m.content)m.content=txt||'⚠️ No response.'}
 catch(e){m.content=m.content||'⚠️ Could not reach the server.'}
 c.messages.push(m);save();busy=false;$('go').disabled=false;render();$('q').focus()}
function autosize(){const q=$('q');q.style.height='auto';q.style.height=Math.min(q.scrollHeight,140)+'px'}
$('q').addEventListener('input',autosize);
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send($('q').value)}});
$('go').onclick=()=>send($('q').value);
$('new').onclick=()=>{cur=null;render();$('q').focus();$('side').classList.remove('open')};
$('search').oninput=renderSide;$('burger').onclick=()=>$('side').classList.toggle('open');
$('clear').onclick=()=>{if(confirm('Delete all saved chats in this browser?')){chats=[];cur=null;save();render()}};
$('theme').onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue('--bg').trim()==='#12141c';d.dataset.theme=dark?'light':'dark';try{localStorage.setItem('cg_theme',d.dataset.theme)}catch(e){}};
(()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition,b=$('mic');if(!SR){b.style.display='none';return}
 const r=new SR();r.lang='en-IN';r.interimResults=true;let on=false;
 r.onresult=e=>{$('q').value=Array.from(e.results).map(x=>x[0].transcript).join('');autosize()};
 r.onend=()=>{on=false;b.classList.remove('on')};
 b.onclick=()=>{if(on)r.stop();else{try{r.start();on=true;b.classList.add('on')}catch(e){}}}})();
render();
</script>
</body>
</html>
